name: Release VS Code Extension

# Release: bump editors/vscode/package.json, add a CHANGELOG.md entry, merge,
# then push a tag `vscode-v<version>`. This checks the tag, version and
# changelog agree, runs the tests, packages the .vsix once, creates the
# GitHub Release (notes from CHANGELOG.md, .vsix attached), and publishes
# that same .vsix to the VS Code Marketplace and Open VSX.
#
# Run it by hand ("Run workflow") to check a branch: it builds, tests and
# packages, but never releases or publishes.

on:
  push:
    tags: [ 'vscode-v*' ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: editors/vscode

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      vsix: ${{ steps.meta.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version, tag and changelog
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "vscode-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected vscode-v$version)"
            exit 1
          fi
          node scripts/release-notes.js "$version" > release-notes.md
          prerelease=$(node scripts/release-notes.js "$version" --prerelease)
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "vsix=blackbox-debug-$version.vsix"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (pre-release: $prerelease)"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: VS Code tests
        run: xvfb-run -a npm test

      - name: Package extension
        run: npx @vscode/vsce package ${{ steps.meta.outputs.prerelease == 'true' && '--pre-release' || '' }} -o ${{ steps.meta.outputs.vsix }}

      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-vsix
          path: |
            editors/vscode/${{ steps.meta.outputs.vsix }}
            editors/vscode/release-notes.md

  github-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blackbox-vsix

      - name: Create GitHub Release
        run: >
          gh release create "$GITHUB_REF_NAME" "${{ needs.build.outputs.vsix }}"
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Blackbox for VS Code ${{ needs.build.outputs.version }}"
          --notes-file release-notes.md
          ${{ needs.build.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}
        env:
          GH_TOKEN: ${{ github.token }}

  publish-vscode:
    needs: [ build, github-release ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blackbox-vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath "${{ needs.build.outputs.vsix }}" ${{ needs.build.outputs.prerelease == 'true' && '--pre-release' || '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    needs: [ build, github-release ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blackbox-vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to Open VSX Registry
        run: npx ovsx publish "${{ needs.build.outputs.vsix }}" ${{ needs.build.outputs.prerelease == 'true' && '--pre-release' || '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
